body:after{
  content:"";position:fixed;inset:0;
  background:radial-gradient(circle at 50% 20%,rgba(255,255,255,.12),transparent 38%);
  z-index:-1;pointer-events:none;
}
.wrap{width:min(100%,460px);padding:28px 20px 30px;display:flex;flex-direction:column;align-items:center}
.logo{
  width:116px;height:116px;border-radius:50%;object-fit:cover;
  box-shadow:0 10px 30px rgba(0,0,0,.28);
  border:3px solid rgba(255,255,255,.78);
  margin-top:4px
}
h1{font-family:Georgia,serif;font-weight:500;letter-spacing:5px;margin:17px 0 4px;font-size:32px}
.tag{font-size:14px;letter-spacing:1.2px;opacity:.88;margin:0 0 23px;text-align:center}
.card{width:100%;display:flex;flex-direction:column;gap:12px}
a.btn{
  text-decoration:none;color:#073e2e;background:rgba(255,255,255,.96);
  min-height:58px;border-radius:16px;padding:0 20px;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;letter-spacing:.2px;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
  transition:transform .15s ease,background .15s ease;
}
a.btn:hover{transform:translateY(-2px);background:#fff}
a.primary{background:#dfeee7;color:#063f2e}
.icon{width:24px;margin-right:10px;font-size:20px;text-align:center}
.address{
  margin-top:20px;padding:15px 16px;width:100%;text-align:center;
  border:1px solid rgba(255,255,255,.24);border-radius:15px;
  background:rgba(0,0,0,.15);backdrop-filter:blur(6px);
  font-size:13px;line-height:1.5;opacity:.94
}
.footer{font-size:11px;opacity:.62;margin-top:19px;letter-spacing:1px}
@media (max-width:380px){h1{font-size:28px}.wrap{padding-left:15px;padding-right:15px}}
</style>
